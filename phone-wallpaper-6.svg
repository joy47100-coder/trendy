    <rect x="182" y="140" width="12" height="12" fill="#06FFA5" />
    <rect x="198" y="140" width="12" height="12" fill="#06FFA5" />
    <rect x="214" y="140" width="12" height="12" fill="#3A86FF" />
    <rect x="230" y="140" width="12" height="12" fill="#8338EC" />

    <!-- 하단 패턴 -->
    <rect x="145" y="220" width="12" height="12" fill="#FF006E" />
    <rect x="161" y="220" width="12" height="12" fill="#FB5607" />
    <rect x="177" y="220" width="12" height="12" fill="#FFBE0B" />
    <rect x="193" y="220" width="12" height="12" fill="#06FFA5" />
    <rect x="209" y="220" width="12" height="12" fill="#3A86FF" />
    <rect x="225" y="220" width="12" height="12" fill="#8338EC" />
    <rect x="241" y="220" width="12" height="12" fill="#FF006E" />

    <!-- 추가 패턴 -->
    <rect x="155" y="300" width="12" height="12" fill="#3A86FF" />
    <rect x="171" y="300" width="12" height="12" fill="#06FFA5" />
    <rect x="187" y="300" width="12" height="12" fill="#06FFA5" />
