  </defs>
  <g clip-path="url(#screenClip)">
    <rect x="120" y="50" width="272" height="412" fill="#1A1A2E" />

    <!-- 8비트 격자 패턴 (픽셀 블록들) -->
    <!-- 상단 패턴 -->
    <rect x="140" y="70" width="12" height="12" fill="#FF006E" />
    <rect x="156" y="70" width="12" height="12" fill="#FF006E" />
    <rect x="172" y="70" width="12" height="12" fill="#FFBE0B" />
    <rect x="188" y="70" width="12" height="12" fill="#FB5607" />
    <rect x="204" y="70" width="12" height="12" fill="#FB5607" />
    <rect x="220" y="70" width="12" height="12" fill="#FFBE0B" />
    <rect x="236" y="70" width="12" height="12" fill="#FF006E" />
    <rect x="252" y="70" width="12" height="12" fill="#FF006E" />

    <!-- 중간 패턴 -->
    <rect x="150" y="140" width="12" height="12" fill="#8338EC" />
