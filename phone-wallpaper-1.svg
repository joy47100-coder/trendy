<svg width="1024" height="1024" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 (투명) -->
  <!-- 아이폰 테두리 -->
  <rect x="106" y="30" width="300" height="452" rx="40" fill="#999999" />
  <!-- 아이폰 화면 -->
  <rect x="120" y="50" width="272" height="412" rx="35" fill="#000000" />
  <!-- 노치 -->
  <rect x="206" y="50" width="100" height="28" rx="14" fill="#ffffff" />
  <!-- 홈버튼 -->
  <circle cx="256" cy="450" r="18" fill="none" stroke="#ffffff" stroke-width="2" />

  <!-- 배경화면: 손그림 플랫 (따뜻한 톤) -->
  <defs>
    <clipPath id="screenClip">
      <rect x="120" y="50" width="272" height="412" rx="35" />
    </clipPath>
  </defs>
  <g clip-path="url(#screenClip)">
    <rect x="120" y="50" width="272" height="412" fill="#000000" />

    <!-- 따뜻한 톤 도형들 -->
    <circle cx="180" cy="120" r="35" fill="#E8A87C" opacity="0.9" />
    <rect x="260" y="140" width="60" height="60" fill="#D4845C" opacity="0.85" />
    <polygon points="160,280 200,240 240,280" fill="#F5B88C" opacity="0.9" />
    <circle cx="300" cy="320" r="28" fill="#C4944C" opacity="0.8" />
    <line x1="150" y1="380" x2="320" y2="380" stroke="#E8A87C" stroke-width="3" opacity="0.8" />
    <line x1="140" y1="400" x2="310" y2="400" stroke="#D4845C" stroke-width="2" opacity="0.7" />
  </g>
</svg>