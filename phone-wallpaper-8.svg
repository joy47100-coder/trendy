<svg width="1024" height="1024" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- 아이폰 테두리 -->
  <rect x="106" y="30" width="300" height="452" rx="40" fill="#999999" />
  <!-- 아이폰 화면 -->
  <rect x="120" y="50" width="272" height="412" rx="35" fill="#000000" />
  <!-- 노치 -->
  <rect x="206" y="50" width="100" height="28" rx="14" fill="#ffffff" />
  <!-- 홈버튼 -->
  <circle cx="256" cy="450" r="18" fill="none" stroke="#ffffff" stroke-width="2" />

  <!-- 배경화면: 콜라주 찢어진 종이 -->
  <defs>
    <clipPath id="screenClip">
      <rect x="120" y="50" width="272" height="412" rx="35" />
    </clipPath>
  </defs>
  <g clip-path="url(#screenClip)">
    <rect x="120" y="50" width="272" height="412" fill="#E8D5C4" />

    <!-- 찢어진 종이 조각 1 (주황색) -->
    <polygon points="140,80 180,70 175,120 145,125" fill="#E67E22" stroke="#2C3E50" stroke-width="1.5" stroke-linejoin="bevel" />

    <!-- 찢어진 종이 조각 2 (분홍색) -->
    <polygon points="250,85 300,90 295,150 255,135" fill="#E8747E" stroke="#2C3E50" stroke-width="1.5" stroke-linejoin="bevel" />

    <!-- 찢어진 종이 조각 3 (초록색) -->
    <polygon points="135,200 175,195 190,250 155,245" fill="#52C4A8" stroke="#2C3E50" stroke-width="1.5" stroke-linejoin="bevel" />

    <!-- 찢어진 종이 조각 4 (노랑색) -->
    <polygon points="240,210 290,220 285,280 245,270" fill="#F1C40F" stroke="#2C3E50" stroke-width="1.5" stroke-linejoin="bevel" />

    <!-- 찢어진 종이 조각 5 (보라색) -->
    <polygon points="150,310 200,305 210,360 160,365" fill="#9B59B6" stroke="#2C3E50" stroke-width="1.5" stroke-linejoin="bevel" />

    <!-- 찢어진 종이 조각 6 (파란색) -->
    <polygon points="250,320 310,330 300,390 260,385" fill="#3498DB" stroke="#2C3E50" stroke-width="1.5" stroke-linejoin="bevel" />

    <!-- 그림자 효과 (어두운 테두리) -->
    <polygon points="140,80 180,70 175,120 145,125" fill="none" stroke="#1C2833" stroke-width="0.5" opacity="0.3" />
    <polygon points="250,85 300,90 295,150 255,135" fill="none" stroke="#1C2833" stroke-width="0.5" opacity="0.3" />
  </g>
</svg>