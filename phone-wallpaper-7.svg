<svg width="1024" height="1024" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 아이폰 테두리 -->
  <rect x="106" y="30" width="300" height="452" rx="40" fill="#999999" />
  <!-- 아이폰 화면 -->
  <rect x="120" y="50" width="272" height="412" rx="35" fill="#000000" />
  <!-- 노치 -->
  <rect x="206" y="50" width="100" height="28" rx="14" fill="#ffffff" />
  <!-- 홈버튼 -->
  <circle cx="256" cy="450" r="18" fill="none" stroke="#ffffff" stroke-width="2" />

  <!-- 배경화면: 네온 글로우 -->
  <defs>
    <clipPath id="screenClip">
      <rect x="120" y="50" width="272" height="412" rx="35" />
    </clipPath>
  </defs>
  <g clip-path="url(#screenClip)">
    <rect x="120" y="50" width="272" height="412" fill="#0a0a0a" />

    <!-- 네온 라인들 -->
    <line x1="140" y1="120" x2="320" y2="140" stroke="#00FF00" stroke-width="3" filter="url(#neonGlow)" />
    <line x1="160" y1="180" x2="310" y2="170" stroke="#FF00FF" stroke-width="3" filter="url(#neonGlow)" />
    <line x1="135" y1="250" x2="325" y2="260" stroke="#00FFFF" stroke-width="3" filter="url(#neonGlow)" />
    <line x1="150" y1="320" x2="300" y2="310" stroke="#FFFF00" stroke-width="3" filter="url(#neonGlow)" />
    <line x1="130" y1="380" x2="330" y2="390" stroke="#FF0080" stroke-width="3" filter="url(#neonGlow)" />

    <!-- 네온 원들 -->
    <circle cx="220" cy="200" r="20" fill="none" stroke="#00FF00" stroke-width="2" filter="url(#neonGlow)" />
    <circle cx="260" cy="280" r="25" fill="none" stroke="#FF00FF" stroke-width="2" filter="url(#neonGlow)" />
    <circle cx="180" cy="340" r="15" fill="none" stroke="#00FFFF" stroke-width="2" filter="url(#neonGlow)" />
  </g>
</svg>